name: nuget release
on:
  workflow_dispatch: {}
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/Mathsolver.Tests
      - run: dotnet pack src/Mathsolver -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/*.nupkg
